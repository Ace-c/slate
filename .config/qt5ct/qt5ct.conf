[Appearance]
color_scheme_path=/usr/share/qt5ct/colors/darker.conf
custom_palette=false
icon_theme=slate
standard_dialogs=default
style=kvantum

[Fonts]
fixed="IBM Plex Sans,10,-1,5,50,0,0,0,0,0,Regular"
general="Inter,10,-1,5,50,0,0,0,0,0,Regular"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=3
cursor_flash_time=1200
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=General, AnimateMenu, AnimateCombo, AnimateTooltip, AnimateToolBox
keyboard_scheme=4
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=/usr/share/qt5ct/qss/fusion-fixes.qss, /usr/share/qt5ct/qss/scrollbar-simple.qss, /usr/share/qt5ct/qss/sliders-simple.qss, /usr/share/qt5ct/qss/tooltip-simple.qss, /usr/share/qt5ct/qss/traynotification-simple.qss
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[SettingsWindow]
geometry=@ByteArray(\x1\xd9\xd0\xcb\0\x3\0\0\0\0\x2\x36\0\0\0J\0\0\x5\x14\0\0\x2\xee\0\0\x2\x36\0\0\0j\0\0\x5\x14\0\0\x2\xee\0\0\0\0\0\0\0\0\a\x80\0\0\x2\x36\0\0\0j\0\0\x5\x14\0\0\x2\xee)

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()
